<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<title>Francos läxor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#173a37" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Läxor" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="assets/engine.css" />
</head>
<body>
<div class="landing">
  <div class="landing-header">
    <svg class="compass" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="17" stroke="var(--navy)" stroke-width="1.6"/>
      <path d="M20 6 L23.5 18 L20 34 L16.5 18 Z" fill="var(--brass)"/>
      <path d="M20 6 L23.5 18 L20 20 Z" fill="var(--navy)"/>
      <circle cx="20" cy="20" r="2" fill="var(--navy)"/>
    </svg>
    <div>
      <h1 class="landing-title">Francos läxor</h1>
      <p class="landing-sub">Välj en läxa att svepa igenom.</p>
    </div>
  </div>

  <ul class="homework-list" id="homeworkList"></ul>
  <p class="landing-footer">Svaren sparas i den här webbläsaren, på den här enheten.</p>
</div>

<script>
(function () {
  "use strict";

  // Lägg till nya läxor här när de kommer – en rad per läxa.
  var HOMEWORK_LIST = [
    {
      storageKey: "franco-svenska-den-mystiska-on-v1",
      href: "laxor/den-mystiska-on.html",
      subject: "Svenska · Årskurs 4",
      title: "Den mystiska ön",
      desc: "Läsförståelse, stavning, ordklasser och en egen fortsättning på berättelsen.",
      accent: "var(--brass)"
    },
    {
      storageKey: "franco-matte-tal-1-v1",
      href: "laxor/matte-tal-1.html",
      subject: "Matte · Årskurs 4",
      title: "Veckans mattetal",
      desc: "Huvudräkning, multiplikationstabellen, uppställning, klockan och problemlösning.",
      accent: "var(--sea)"
    },
    {
      storageKey: "franco-biologi-instudering-1-v1",
      href: "laxor/biologi-instudering-1.html",
      subject: "Biologi",
      title: "Instuderingsfrågor",
      desc: "28 frågor om celler, livets kännetecken och djurriket. Tryck fram facit och skatta dig själv.",
      accent: "var(--coral)"
    }
  ];

  var REGISTRY_KEY = "francoLaxorRegistry";
  var registry = {};
  try { registry = JSON.parse(localStorage.getItem(REGISTRY_KEY) || "{}"); } catch (e) { /* ignore */ }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var listEl = document.getElementById("homeworkList");

  if (HOMEWORK_LIST.length === 0) {
    var empty = document.createElement("div");
    empty.className = "landing-empty";
    empty.textContent = "Inga läxor tillagda än.";
    listEl.replaceWith(empty);
    return;
  }

  HOMEWORK_LIST.forEach(function (hw) {
    var entry = registry[hw.storageKey];
    var statusClass = "tile-status";
    var statusText = "Inte påbörjad";
    var barPct = 0;

    if (entry) {
      barPct = Math.round((entry.current / entry.total) * 100);
      if (entry.done) {
        statusClass += " is-done";
        statusText = "Klar ✓";
      } else {
        statusClass += " is-started";
        statusText = "Fortsätt – fråga " + entry.current + " av " + entry.total;
      }
    }

    var li = document.createElement("li");
    li.innerHTML =
      '<a class="homework-tile" style="--tile-accent:' + hw.accent + '" href="' + esc(hw.href) + '">' +
      '<div class="tile-top"><span class="tile-subject">' + esc(hw.subject) + "</span></div>" +
      '<h2 class="tile-title">' + esc(hw.title) + "</h2>" +
      '<p class="tile-desc">' + esc(hw.desc) + "</p>" +
      '<div class="' + statusClass + '"><span class="dot"></span>' + esc(statusText) + "</div>" +
      (entry ? '<div class="tile-bar"><div class="tile-bar-fill" style="width:' + barPct + '%"></div></div>' : "") +
      "</a>";
    listEl.appendChild(li);
  });
})();
</script>
<script src="assets/register-sw.js"></script>
</body>
</html>
