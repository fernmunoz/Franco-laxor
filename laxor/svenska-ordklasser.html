<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<title>Substantiv, adjektiv och verb – Svenska</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="theme-color" content="#173a37" />

</head>
<body>
<div id="app"></div>
<script src="../assets/engine.js"></script>
<script src="../assets/register-sw.js"></script>
<script>
(function () {
  "use strict";

  // Svenskaboken, kapitel 1 till 3 (substantiv, adjektiv, verb), sidorna 5 till 24, i
  // sidordning. Teorin är sammanfattad med egna ord och övningstexterna är egna, i samma
  // stil som bokens. Bokens bilduppgifter finns som "titta i boken"-kort.

  function strip(w) { return String(w).replace(/[.,!?:;]/g, "").toLowerCase(); }

  var cards = [];
  var META = []; // till sammanfattningen
  var counter = 0;

  // Varje sida är en lista av "uppgifter". Eyebrow och numrering (1 av N) räknas ut här.
  //   read:     { t: "read", html }
  //   flip:     { t: "flip", q, a, write }
  //   choice:   { t: "choice", q, c, w: [fel...], hint }
  //   classify: { t: "classify", subject, c: "U" | "N" }
  //   pick:     { t: "pick", q, words, ans: [rätta ord], explain }
  function page(pg, title, items) {
    var total = items.filter(function (it) { return it.t !== "read"; }).length;
    var n = 0;
    items.forEach(function (it) {
      if (it.t === "read") {
        cards.push({ type: "read", eyebrow: "s." + pg + " · " + title + " · att komma ihåg", title: it.title || "", html: it.html });
        return;
      }
      n++;
      var key = "k." + (counter++);
      var eyebrow = "s." + pg + " · " + title + (total > 1 ? " · " + n + " av " + total : "");
      var meta = { key: key, t: it.t, pg: pg, title: title };

      if (it.t === "flip") {
        cards.push({ type: "flip", eyebrow: eyebrow, question: it.q, page: "s." + pg, answer: it.a, correct: "kunde", key: key, write: !!it.write, rows: it.rows });
        meta.label = it.q; meta.answer = it.a; meta.write = !!it.write;
      } else if (it.t === "choice") {
        cards.push({
          type: "choice", eyebrow: eyebrow, prompt: it.q, big: true,
          options: [it.c].concat(it.w), correct: it.c, key: key,
          correctMsg: "Rätt! " + it.hint, wrongMsg: "Nästan. " + it.hint
        });
        meta.label = it.q; meta.correct = it.c;
      } else if (it.t === "classify") {
        cards.push({
          type: "classify", eyebrow: eyebrow, subject: it.subject,
          tags: ["U", "N"], tagNames: { U: "utrum (en)", N: "neutrum (ett)" },
          correct: it.c, key: key
        });
        meta.label = "Utrum eller neutrum: " + it.subject; meta.correct = it.c;
      } else if (it.t === "pick") {
        var set = {};
        it.ans.forEach(function (w) { set[strip(w)] = true; });
        var answers = [];
        it.words.forEach(function (w, i) { if (set[strip(w)]) answers.push(i); });
        cards.push({ type: "pick", eyebrow: eyebrow, prompt: it.q, words: it.words, answers: answers, explain: it.explain, correct: "ratt", key: key });
        meta.label = it.q;
      }
      META.push(meta);
    });
  }

  // ---------- kapitel 1: substantiv ----------

  page(5, "Substantiv i bilden", [
    { t: "flip", write: true, rows: 5,
      q: "Titta på bilden i boken, s.5 (parken med kiosken). Hur många substantiv hittar du? Skriv dem med en, ett eller flera framför, t.ex. en boll, flera äpplen.",
      a: "Exempel på substantiv i bilden: en kiosk, en cykel, en soptunna, en katt, en korg, en skål, flera äpplen, en filt, en bänk, en bok, en ryggsäck, en keps, en damm, flera ankor, flera fåglar, en groda, flera fjärilar, ett träd, ett hus, en boll, en flicka, en pojke.\nHittade du fler? Då är det bara bra." }
  ]);

  var R6 = [
    { sing: "pojke", sf: "en pojke", plur: "flera pojkar", g: "U", missing: "plur", w: ["flera pojkor", "flera pojke"] },
    { sing: "öga", sf: "ett öga", plur: "flera ögon", g: "N", missing: "plur", w: ["flera ögar", "flera öga"] },
    { sing: "finger", sf: "ett finger", plur: "flera fingrar", g: "N", missing: "sing", w: ["en finger", "ett fingar"] },
    { sing: "fönster", sf: "ett fönster", plur: "flera fönster", g: "N", missing: "sing", w: ["en fönster", "ett fönstra"] },
    { sing: "bil", sf: "en bil", plur: "flera bilar", g: "U", missing: "plur", w: ["flera bilor", "flera biler"] },
    { sing: "strumpa", sf: "en strumpa", plur: "flera strumpor", g: "U", missing: "sing", w: ["ett strumpa", "en strump"] },
    { sing: "hund", sf: "en hund", plur: "flera hundar", g: "U", missing: "sing", w: ["ett hund", "en hunda"] },
    { sing: "ansikte", sf: "ett ansikte", plur: "flera ansikten", g: "N", missing: "plur", w: ["flera ansikter", "flera ansikta"] }
  ];
  var items6 = [
    { t: "read", html:
      "<p><b>Singular</b> betyder en av något: <i>en kaka, ett ljud</i>.<br><b>Plural</b> betyder flera: <i>flera kakor, flera ljud</i>.</p>" +
      "<p>Substantiv har olika <b>genus</b>. Kan du säga <b>en</b> är ordet <b>utrum</b>: <i>en sko, en bil</i>. Kan du säga <b>ett</b> är ordet <b>neutrum</b>: <i>ett skåp, ett hus</i>.</p>" +
      "<p>Bestämd form: <i>den skon, den bilen, det skåpet, det huset</i>.</p>" }
  ];
  R6.forEach(function (r) {
    items6.push(r.missing === "plur"
      ? { t: "choice", q: "Plural till '" + r.sf + "'?", c: r.plur, w: r.w, hint: r.sf.charAt(0) === "e" && r.sf.indexOf("en ") === 0 ? "En " + r.sing + ", " + r.plur + "." : "Ett " + r.sing + ", " + r.plur + "." }
      : { t: "choice", q: "Singular till '" + r.plur + "'?", c: r.sf, w: r.w, hint: r.sf.charAt(0).toUpperCase() + r.sf.slice(1) + ", " + r.plur + "." });
    items6.push({ t: "classify", subject: r.sing, c: r.g });
  });
  page(6, "Singular, plural och genus", items6);

  page(7, "Hitta substantiven", [
    { t: "pick",
      q: "Tryck på alla substantiv. Testa att säga en, ett eller flera före ordet. Det finns tio.",
      words: ["cykel", "hästar", "jobba", "bulle", "sover", "böcker", "jobb", "lampa", "stark", "läser", "jag", "ledsen", "päron", "orange", "oss", "arg", "gul", "glas", "filmer", "träd"],
      ans: ["cykel", "hästar", "bulle", "böcker", "jobb", "lampa", "päron", "glas", "filmer", "träd"],
      explain: "Substantiven: cykel, hästar, bulle, böcker, jobb, lampa, päron, glas, filmer, träd.\nVerb: jobba, sover, läser. Adjektiv: stark, ledsen, orange, arg, gul. Pronomen: jag, oss." }
  ]);

  function forms(sg, sgBest, plur, plurBest, genus) {
    return "Obestämd singular: " + sg + "\nBestämd singular: " + sgBest + "\nObestämd plural: " + plur + "\nBestämd plural: " + plurBest + (genus ? "\nGenus: " + genus : "");
  }
  page(8, "Bestämd och obestämd form", [
    { t: "read", html:
      "<p>Substantiv kan stå i <b>obestämd</b> eller <b>bestämd</b> form.</p>" +
      "<p><b>Obestämd form:</b> <i>en, ett</i> eller <i>flera</i> framför ordet: <i>en gris, flera grisar</i>.</p>" +
      "<p><b>Bestämd form:</b> ordet får en ändelse, och man kan säga <i>den, det, de</i> framför: <i>grisen, grisarna</i>.</p>" +
      "<p>Varje substantiv har alltså fyra former: obestämd och bestämd, både i singular och plural. Exempel: <i>en gris, grisen, flera grisar, grisarna</i>.</p>" },
    { t: "flip", q: "Skriv alla fyra former av: cykel", a: forms("en cykel", "cykeln", "flera cyklar", "cyklarna") },
    { t: "flip", q: "Skriv alla fyra former av: hästar", a: forms("en häst", "hästen", "flera hästar", "hästarna") },
    { t: "flip", q: "Skriv alla fyra former av: bulle", a: forms("en bulle", "bullen", "flera bullar", "bullarna") },
    { t: "flip", q: "Skriv alla fyra former av: böcker", a: forms("en bok", "boken", "flera böcker", "böckerna") },
    { t: "flip", q: "Skriv alla fyra former av: jobb", a: forms("ett jobb", "jobbet", "flera jobb", "jobben") },
    { t: "flip", q: "Skriv alla fyra former av: lampa", a: forms("en lampa", "lampan", "flera lampor", "lamporna") },
    { t: "flip", q: "Skriv alla fyra former av: päron", a: forms("ett päron", "päronet", "flera päron", "päronen") },
    { t: "flip", q: "Skriv alla fyra former av: glas", a: forms("ett glas", "glaset", "flera glas", "glasen") },
    { t: "flip", q: "Skriv alla fyra former av: filmer", a: forms("en film", "filmen", "flera filmer", "filmerna") },
    { t: "flip", q: "Skriv alla fyra former av: träd", a: forms("ett träd", "trädet", "flera träd", "träden") }
  ]);

  page(9, "Egennamn", [
    { t: "read", html:
      "<p><b>Egennamn</b> räknas också som substantiv. De skrivs alltid med <b>stor bokstav</b>, även mitt i en mening.</p>" +
      "<p>Exempel: <i>Birgitta, Oskar, Frankrike, London, Renault</i>.</p>" +
      "<p>Namn på högtider är <b>inte</b> egennamn och skrivs med liten bokstav: <i>jul, nyår, midsommar</i>.</p>" },
    { t: "flip", write: true, rows: 3, q: "Skriv så många egennamn du kan: personer. Tänk på stor bokstav! (Exempel: Thea)", a: "Exempel: Thea, Oskar, Birgitta, Emma, Liam, Ida.\nAlla börjar med stor bokstav." },
    { t: "flip", write: true, rows: 3, q: "Skriv så många egennamn du kan: geografiska platser. (Exempel: Vänern)", a: "Exempel: Vänern, Sverige, Frankrike, London, Kebnekaise, Stockholm.\nAlla börjar med stor bokstav." },
    { t: "flip", write: true, rows: 3, q: "Skriv så många egennamn du kan: varumärken. (Exempel: Gevalia)", a: "Exempel: Gevalia, Renault, Volvo, Nintendo, Lego, Loka.\nAlla börjar med stor bokstav." },
    { t: "flip", write: true, rows: 3, q: "Skriv så många egennamn du kan: böcker, filmer, spel och appar. (Exempel: Instagram)", a: "Exempel: Instagram, Minecraft, Bamse, Harry Potter, Fortnite.\nAlla börjar med stor bokstav." },
    { t: "choice", q: "Vilket av orden är ett egennamn?", c: "frankrike", w: ["jul", "midsommar"], hint: "Länder är egennamn och skrivs med stor bokstav: Frankrike. Högtider är inte egennamn." },
    { t: "choice", q: "Vilket ord ska skrivas med liten bokstav mitt i en mening?", c: "nyår", w: ["Oskar", "London"], hint: "Högtider som nyår skrivs med liten bokstav. Namn på personer och platser skrivs med stor." }
  ]);

  page(10, "Egennamn i en text", [
    { t: "pick",
      q: "I texten har egennamnen skrivits med liten bokstav. Tryck på alla ord som ska ha stor bokstav för att de är egennamn.",
      words: ("På lördagen åkte emma och hennes familj till göteborg i deras gamla saab. Pappa oskar körde hela vägen. " +
              "De skulle träffa moster lisa som bor nära vänern. På vägen stannade de i lidköping och åt glass. " +
              "Sedan köpte emma tidningen kamratposten.").split(" "),
      ans: ["emma", "göteborg", "saab", "oskar", "lisa", "vänern", "lidköping", "kamratposten"],
      explain: "Egennamnen: Emma (två gånger), Göteborg, Saab, Oskar, Lisa, Vänern, Lidköping och Kamratposten.\nPappa, moster, glass och tidningen är vanliga substantiv och skrivs med liten bokstav (utom första ordet i en mening)." }
  ]);

  page(11, "Repetition: substantiv", [
    { t: "flip", write: true, rows: 3, q: "Skriv tre ord som tillhör ordklassen substantiv.", a: "Exempel: bil, katt, glass, skola, cykel.\nTesta: går det att säga en, ett eller flera före ordet?" },
    { t: "flip", q: "Vad betyder singular?", a: "Singular betyder en av något: en bil, ett hus." },
    { t: "flip", q: "Vad betyder plural?", a: "Plural betyder flera av något: flera bilar, flera hus." },
    { t: "pick",
      q: "Tryck på de ord som är substantiv. Det finns fem.",
      words: ["bil", "svag", "grön", "äta", "vi", "snarkar", "äpple", "ko", "glass", "tak"],
      ans: ["bil", "äpple", "ko", "glass", "tak"],
      explain: "Substantiven: bil, äpple, ko, glass, tak.\nAdjektiv: svag, grön. Verb: äta, snarkar. Pronomen: vi." }
  ]);

  page(12, "Substantiv och egennamn", [
    { t: "flip", q: "Skriv alla fyra former och säg vilket genus: bil", a: forms("en bil", "bilen", "flera bilar", "bilarna", "utrum") },
    { t: "flip", q: "Skriv alla fyra former och säg vilket genus: äpple", a: forms("ett äpple", "äpplet", "flera äpplen", "äpplena", "neutrum") },
    { t: "flip", q: "Skriv alla fyra former och säg vilket genus: ko", a: forms("en ko", "kon", "flera kor", "korna", "utrum") },
    { t: "flip", q: "Skriv alla fyra former och säg vilket genus: glass", a: forms("en glass", "glassen", "flera glassar", "glassarna", "utrum") },
    { t: "flip", q: "Skriv alla fyra former och säg vilket genus: tak", a: forms("ett tak", "taket", "flera tak", "taken", "neutrum") },
    { t: "pick",
      q: "Alla ord är substantiv, och sex av dem är egennamn. Tryck på egennamnen.",
      words: ["stockholm", "varg", "rudolf", "moln", "blomma", "kebnekaise", "aftonbladet", "tidning", "maria", "dator", "gräsklippare", "nintendo"],
      ans: ["stockholm", "rudolf", "kebnekaise", "aftonbladet", "maria", "nintendo"],
      explain: "Egennamnen, rätt skrivna: Stockholm, Rudolf, Kebnekaise, Aftonbladet, Maria, Nintendo.\nDe andra är vanliga substantiv." }
  ]);

  page(13, "Korsord (substantiv)", [
    { t: "flip", q: "Vågrätt 3: Plagg för fötter", a: "strumpor" },
    { t: "flip", q: "Vågrätt 6: Sveriges huvudstad", a: "Stockholm" },
    { t: "flip", q: "Vågrätt 7: Sveriges högsta berg", a: "Kebnekaise" },
    { t: "flip", q: "Vågrätt 10: Frukt med speciell form", a: "päron" },
    { t: "flip", q: "Vågrätt 11: (bilden med hästarna)", a: "hästar" },
    { t: "flip", q: "Vågrätt 12: (bilden med kanelbullen)", a: "bulle" },
    { t: "flip", q: "Lodrätt 1: Svalkar en varm dag", a: "glass" },
    { t: "flip", q: "Lodrätt 2: Trädgårdsredskap", a: "Flera ord kan passa, t.ex. gräsklippare, skottkärra, kratta eller spade.\nRäkna rutorna i korsordet och se vilket som passar med de andra orden." },
    { t: "flip", q: "Lodrätt 4: Sveriges största sjö", a: "Vänern" },
    { t: "flip", q: "Lodrätt 5: Synonym till kille", a: "pojke" },
    { t: "flip", q: "Lodrätt 8: Arbete", a: "jobb" },
    { t: "flip", q: "Lodrätt 9: Växt med stam och krona", a: "träd" }
  ]);

  // ---------- kapitel 2: adjektiv ----------

  page(14, "Adjektiv", [
    { t: "read", html:
      "<p>Ordklassen <b>adjektiv</b> är ord som beskriver hur något eller någon ser ut eller är.</p>" +
      "<p>Exempel: <i>Bilen är röd. Vattnet är varmt. Jag är trött.</i></p>" +
      "<p>Adjektiv beskriver substantiv (<i>bilen, vattnet</i>) och pronomen (<i>jag</i>).</p>" }
  ]);

  page(15, "Adjektiv i bilden", [
    { t: "flip", write: true, rows: 5,
      q: "Titta på vinterbilden i boken, s.15. Leta efter adjektiv och skriv upp dem. (Exempel: grön)",
      a: "Exempel: vit, kall, snöig, grön, gul, lila, svart, orange, liten, stor.\nAdjektiven beskriver hur något ser ut, t.ex. en vit snögubbe, en svart katt." }
  ]);

  page(16, "Bilda meningar", [
    { t: "flip", write: true, rows: 6,
      q: "Välj fem av adjektiven du skrivit och bilda en mening med varje. (Exempel: Gräset är grönt.)",
      a: "Exempel:\nSnön är vit.\nKatten är svart.\nCykeln är lila.\nVattnet är kallt.\nHuset är stort.\nKom ihåg: adjektivet böjs efter substantivet (en katt är svart, ett hus är stort)." }
  ]);

  var items17 = [
    { t: "read", html:
      "<p><b>Kongruensböjning</b> betyder att adjektivet böjs efter det substantiv det beskriver.</p>" +
      "<p>Exempel med <i>röd</i>:<br>" +
      "obestämd singular: <i>en röd boll, ett rött hus</i><br>" +
      "bestämd singular: <i>den röda bollen, det röda huset</i><br>" +
      "obestämd plural: <i>flera röda bollar, flera röda hus</i><br>" +
      "bestämd plural: <i>de röda bollarna, de röda husen</i></p>" },
    { t: "flip", write: true, rows: 3, q: "Hitta på en egen mening med adjektiv i obestämd form singular. Stryk under adjektivet.", a: "Exempel: Jag har en snabb cykel.\n(Adjektivet 'snabb' beskriver 'en cykel'.)" },
    { t: "flip", write: true, rows: 3, q: "Hitta på en egen mening med adjektiv i bestämd form singular.", a: "Exempel: Vi bor i det gula huset.\n(Adjektivet 'gula' beskriver 'det huset'.)" },
    { t: "flip", write: true, rows: 3, q: "Hitta på en egen mening med adjektiv i obestämd form plural.", a: "Exempel: Hon har fem snälla kompisar.\n(Adjektivet 'snälla' beskriver 'kompisar'.)" },
    { t: "flip", write: true, rows: 3, q: "Hitta på en egen mening med adjektiv i bestämd form plural.", a: "Exempel: Jag gillar de stora hundarna.\n(Adjektivet 'stora' beskriver 'de hundarna'.)" },
    { t: "choice", q: "Fyll i rätt form: ett ___ hus (stor)", c: "stort", w: ["stor", "stora"], hint: "Ett-ord i obestämd singular får -t: ett stort hus." },
    { t: "choice", q: "Fyll i rätt form: den ___ bollen (röd)", c: "röda", w: ["röd", "rött"], hint: "I bestämd form slutar adjektivet på -a: den röda bollen." },
    { t: "choice", q: "Fyll i rätt form: flera ___ bilar (snabb)", c: "snabba", w: ["snabb", "snabbt"], hint: "I plural slutar adjektivet på -a: flera snabba bilar." },
    { t: "choice", q: "Fyll i rätt form: en ___ bil (ny)", c: "ny", w: ["nytt", "nya"], hint: "En-ord i obestämd singular: grundformen, en ny bil." },
    { t: "choice", q: "Fyll i rätt form: det ___ huset (grön)", c: "gröna", w: ["grön", "grönt"], hint: "Bestämd form: det gröna huset." },
    { t: "choice", q: "Fyll i rätt form: de ___ husen (gammal)", c: "gamla", w: ["gammal", "gammalt"], hint: "Plural och bestämd form: de gamla husen." }
  ];
  page(17, "Kongruensböjning", items17);

  function trio(p, k, s) { return "Positiv: " + p + "\nKomparativ: " + k + "\nSuperlativ: " + s; }
  page(18, "Komparation", [
    { t: "read", html:
      "<p>Adjektiv kan <b>komparera</b>s, det betyder att man jämför.</p>" +
      "<p>Exempel: <i>Viktor är glad. Petra är gladare. Malin är gladast.</i></p>" +
      "<p>Oftast lägger man till <b>-are/-re</b> och <b>-ast/-st</b>. De tre formerna heter <b>positiv</b> (glad), <b>komparativ</b> (gladare) och <b>superlativ</b> (gladast).</p>" },
    { t: "flip", q: "Positiv: bred. Vad är komparativ och superlativ?", a: trio("bred", "bredare", "bredast") },
    { t: "flip", q: "Komparativ: kallare. Vad är positiv och superlativ?", a: trio("kall", "kallare", "kallast") },
    { t: "flip", q: "Superlativ: starkast. Vad är positiv och komparativ?", a: trio("stark", "starkare", "starkast") },
    { t: "flip", q: "Komparativ: smartare. Vad är positiv och superlativ?", a: trio("smart", "smartare", "smartast") },
    { t: "flip", q: "Positiv: snäll. Vad är komparativ och superlativ?", a: trio("snäll", "snällare", "snällast") },
    { t: "flip", q: "Superlativ: snabbast. Vad är positiv och komparativ?", a: trio("snabb", "snabbare", "snabbast") }
  ]);

  page(19, "Meningar med komparation", [
    { t: "flip", write: true, rows: 6,
      q: "Bilda tre meningar med samma adjektiv: en i positiv, en i komparativ och en i superlativ.",
      a: "Exempel med glad:\nPositiv: Jag är glad.\nKomparativ: Du är gladare än jag.\nSuperlativ: Hon är gladast i klassen." }
  ]);

  page(20, "Repetition: adjektiv", [
    { t: "flip", write: true, rows: 3, q: "Skriv tre ord som tillhör ordklassen adjektiv.", a: "Exempel: röd, snabb, glad, liten, varm.\nTesta: passar ordet i 'Det är ...' eller 'Han är ...'?" },
