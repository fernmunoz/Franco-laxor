<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<title>Matteläxa 1 – Addition och subtraktion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#173a37" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Läxor" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../assets/engine.css" />
</head>
<body>
<div id="app"></div>
<script src="../assets/engine.js"></script>
<script src="../assets/register-sw.js"></script>
<script>
(function () {
  "use strict";

  // Provlista kapitel 2: addition och subtraktion. Uppgifterna från
  // provlistan är med, resten är egna uppgifter i samma stil.

  // Tusentalsavgränsare med hårt mellanslag så "5 187" aldrig radbryts.
  function nb(s) { return String(s).replace(/(\d) (?=\d{3}(?!\d))/g, "$1 "); }

  // Ordningen på alternativen slumpas av motorn, här räcker det med en lista.
  function mk(correct, wrongs) {
    return [correct].concat(wrongs).map(nb);
  }

  var BEGREPP = [
    { q: "Vad kallas svaret i en addition?", c: "summa", w: ["differens", "term"], hint: "Svaret i en addition heter summa." },
    { q: "I additionen 7 + 3 = 10, vad kallas 7 och 3?", c: "termer", w: ["summor", "differenser"], hint: "Talen man adderar eller subtraherar heter termer." },
    { q: "Vad kallas svaret i en subtraktion?", c: "differens", w: ["summa", "term"], hint: "Svaret i en subtraktion heter differens." },
    { q: "Vad är summan av 150 och 60?", c: "210", w: ["90", "200"], hint: "Summa betyder addition: 150 + 60 = 210." },
    { q: "Termerna i en subtraktion är 150 och 60. Vad är differensen?", c: "90", w: ["210", "80"], hint: "Differens betyder subtraktion: 150 − 60 = 90." },
    { q: "Vilken uträkning ger differensen mellan 90 och 40?", c: "90 − 40", w: ["90 + 40", "40 − 90"], hint: "Differensen räknar du ut med subtraktion: 90 − 40 = 50." }
  ];

  var UPPSTALLNING = [
    { q: "Räkna med uppställning: 4 578 + 609",
      a: "Svar: 5 187\nEntalen: 8 + 9 = 17, skriv 7 och minnessiffra 1.\nTiotalen: 7 + 0 + 1 = 8.\nHundratalen: 5 + 6 = 11, skriv 1 och minnessiffra 1.\nTusentalen: 4 + 1 = 5." },
    { q: "Räkna med uppställning: 805 − 543",
      a: "Svar: 262\nEntalen: 5 − 3 = 2.\nTiotalen: 0 − 4 går inte. Växla ett hundratal mot 10 tiotal, då blir det 10 − 4 = 6 och hundratalen minskar från 8 till 7.\nHundratalen: 7 − 5 = 2." },
    { q: "Räkna med uppställning: 854 − 436",
      a: "Svar: 418\nEntalen: 4 − 6 går inte. Växla ett tiotal mot 10 ental: 14 − 6 = 8, tiotalen minskar från 5 till 4.\nTiotalen: 4 − 3 = 1.\nHundratalen: 8 − 4 = 4." },
    { q: "Räkna med uppställning: 1 245 + 386",
      a: "Svar: 1 631\nEntalen: 5 + 6 = 11, skriv 1 och minnessiffra 1.\nTiotalen: 4 + 8 + 1 = 13, skriv 3 och minnessiffra 1.\nHundratalen: 2 + 3 + 1 = 6.\nTusentalen: 1." },
    { q: "Räkna med uppställning: 674 − 298",
      a: "Svar: 376\nEntalen: 4 − 8 går inte. Växla ett tiotal: 14 − 8 = 6, tiotalen minskar från 7 till 6.\nTiotalen: 6 − 9 går inte. Växla ett hundratal: 16 − 9 = 7, hundratalen minskar från 6 till 5.\nHundratalen: 5 − 2 = 3." },
    { q: "Räkna med uppställning: 3 407 + 2 986",
      a: "Svar: 6 393\nEntalen: 7 + 6 = 13, skriv 3 och minnessiffra 1.\nTiotalen: 0 + 8 + 1 = 9.\nHundratalen: 4 + 9 = 13, skriv 3 och minnessiffra 1.\nTusentalen: 3 + 2 + 1 = 6." },
    { q: "Räkna med uppställning: 5 002 − 1 748",
      a: "Svar: 3 254\nTiotalen och hundratalen är nollor, så du växlar steg för steg: 1 tusental blir 10 hundratal, 1 av dem blir 10 tiotal, 1 av dem blir 10 ental.\nEntalen: 12 − 8 = 4.\nTiotalen: 9 − 4 = 5.\nHundratalen: 9 − 7 = 2.\nTusentalen: 4 − 1 = 3." }
  ];

  // Talen till den animerade uppställningen läses ur frågetexten.
  UPPSTALLNING.forEach(function (it) {
    var m = it.q.match(/: ([\d ]+) ([+−]) ([\d ]+)$/);
    it.col = { a: parseInt(m[1].replace(/ /g, ""), 10), op: m[2], b: parseInt(m[3].replace(/ /g, ""), 10) };
  });

  // Genomgång före uppställningarna: subtraktion med uppställning, en del i taget.
  // Kolumn 0 = ental, 1 = tiotal, 2 = hundratal. Se "lesson" i engine.js.
  var ALL = ["a", "b", "op", "rule"];
  var LEKTIONER = [
    { title: "Skriv talen under varandra", col: { a: 748, b: 325, op: "−" }, stages: [
      { show: ["a"], labels: true, text: "Vi ska räkna 748 − 325. Först skriver vi det största talet, 748, högst upp. Siffrorna får var sin ruta: 7 hundratal (H), 4 tiotal (T) och 8 ental (E)." },
      { show: ["b"], text: "Sedan skriver vi talet vi ska ta bort, 325, under. Viktigt: ental under ental, tiotal under tiotal och hundratal under hundratal. Alla siffror ska stå rakt under varandra." },
      { show: ["op", "rule"], text: "Sist sätter vi ett minustecken framför och drar ett streck under. Nu är uppställningen klar! Kom ihåg: vid minus står alltid det största talet överst." }
    ] },
    { title: "Räkna från höger, en kolumn i taget", col: { a: 748, b: 325, op: "−" }, stages: [
      { show: ALL, labels: true, text: "Nu räknar vi 748 − 325. Regel nummer ett: vi börjar alltid längst till höger, med entalen, och räknar sedan åt vänster." },
      { hl: 0, text: "Entalen: 8 − 5. Tänk så här: du har 8 och tar bort 5. Hur många blir kvar?" },
      { hl: 0, res: [0], text: "8 − 5 = 3. Skriv 3 under strecket, i entalen." },
      { hl: 1, text: "Nu tiotalen: 4 − 2." },
      { hl: 1, res: [1], text: "4 − 2 = 2. Skriv 2 under strecket, i tiotalen." },
      { hl: 2, text: "Sist hundratalen: 7 − 3." },
      { hl: 2, res: [2], text: "7 − 3 = 4. Skriv 4. Svaret är 423! Du räknade från höger till vänster, en kolumn i taget." }
    ] },
    { title: "När det inte går: växla", col: { a: 52, b: 27, op: "−" }, stages: [
      { show: ALL, labels: true, text: "Nu ska vi räkna 52 − 27. Vi börjar med entalen, som alltid: 2 − 7." },
      { hl: 0, text: "Vi har 2 ental och ska ta bort 7. Det går inte! Vi har för få ental." },
      { blocks: { from: "tiotal", to: "ental" }, text: "Lösningen är att växla. Ett tiotal är värt lika mycket som 10 ental. Så vi kan ta ett tiotal från tiotalen och göra om det till 10 ental." },
      { chips: { 1: "4", 0: "12" }, struck: [0, 1], text: "Tiotalen: 5 tiotal blir 4 tiotal, för vi tog ett. Entalen: 2 ental och 10 nya ental blir 12 ental. Vi stryker de gamla siffrorna och skriver de nya ovanför." },
      { hl: 0, text: "Nu går det! Entalen: 12 − 7." },
      { hl: 0, res: [0], text: "12 − 7 = 5. Skriv 5 i entalen." },
      { hl: 1, text: "Tiotalen: nu är det 4 tiotal kvar (inte 5, för vi växlade). 4 − 2." },
      { hl: 1, res: [1], text: "4 − 2 = 2. Skriv 2. Svaret är 25! Kom ihåg: när du växlar blir siffran bredvid ett mindre." }
    ] },
    { title: "Växla flera gånger", col: { a: 674, b: 298, op: "−" }, stages: [
      { show: ALL, labels: true, text: "Nu räknar vi 674 − 298. Här måste vi växla två gånger. Vi tar det en kolumn i taget." },
      { hl: 0, text: "Entalen: 4 − 8 går inte. Vi måste växla från tiotalen." },
      { chips: { 1: "6", 0: "14" }, struck: [0, 1], text: "7 tiotal blir 6 tiotal. 4 ental och 10 nya ental blir 14 ental." },
      { hl: 0, res: [0], text: "14 − 8 = 6. Skriv 6 i entalen." },
      { hl: 1, text: "Tiotalen: nu har vi 6 tiotal. 6 − 9 går inte! Vi måste växla igen, nu från hundratalen." },
      { blocks: { from: "hundratal", to: "tiotal" }, chips: { 2: "5", 1: "16" }, struck: [2], text: "Ett hundratal är värt 10 tiotal. 6 hundratal blir 5 hundratal, och 6 tiotal plus 10 nya tiotal blir 16 tiotal." },
      { hl: 1, res: [1], text: "16 − 9 = 7. Skriv 7 i tiotalen." },
      { hl: 2, text: "Hundratalen: nu har vi 5 hundratal kvar. 5 − 2." },
      { hl: 2, res: [2], text: "5 − 2 = 3. Svaret är 376! Du växlade två gånger, och det är helt okej." }
    ] },
    { title: "Växla när det står en nolla", col: { a: 305, b: 168, op: "−" }, stages: [
      { show: ALL, labels: true, hl: 1, text: "Nu räknar vi 305 − 168. Titta på tiotalen: där står en nolla. Det blir lite klurigt, men vi tar det steg för steg." },
      { hl: 0, text: "Entalen: 5 − 8 går inte. Vi måste växla från tiotalen. Men tiotalen är 0, där finns inget att ta!" },
      { blocks: { from: "hundratal", to: "tiotal" }, chips: { 2: "2", 1: "10" }, struck: [2, 1], text: "Då går vi till hundratalen och växlar där först. 3 hundratal blir 2 hundratal, och tiotalen blir 10 (ett hundratal är 10 tiotal)." },
      { blocks: { from: "tiotal", to: "ental" }, chips: { 1: "9", 0: "15" }, struck: [0], text: "Nu har tiotalen något att ge! Vi tar ett tiotal och gör om det till 10 ental. Då blir det 9 tiotal kvar, och entalen blir 5 + 10 = 15." },
      { hl: 0, res: [0], text: "Nu kan vi räkna entalen: 15 − 8 = 7. Skriv 7." },
      { hl: 1, res: [1], text: "Tiotalen: 9 − 6 = 3. Skriv 3." },
      { hl: 2, res: [2], text: "Hundratalen: 2 − 1 = 1. Svaret är 137! Nollor kan kännas svåra, men tänk på att växla steg för steg." }
    ] },
    { title: "Kolla att svaret blev rätt", col: { a: 376, b: 298, op: "+" }, stages: [
      { show: ALL, labels: true, text: "Så här kollar du om du har räknat rätt. Vi fick 674 − 298 = 376. Gör tvärtom med addition: 376 + 298 ska bli 674, talet vi började med." },
      { hl: 0, res: [0], chips: { 1: "1" }, text: "Entalen: 6 + 8 = 14. Skriv 4 och ta med 1 till tiotalen." },
      { hl: 1, res: [1], chips: { 2: "1" }, text: "Tiotalen: 7 + 9 + 1 = 17. Skriv 7 och ta med 1 till hundratalen." },
      { hl: 2, res: [2], text: "Hundratalen: 3 + 2 + 1 = 6. Svaret är 674, precis talet vi började med! Då vet vi att subtraktionen var rätt." }
    ] }
  ];

  var OVERSLAG = [
    { q: "Ungefär hur mycket är 3 798 + 5 235?", c: "9 000", w: ["8 000", "10 000"], hint: "Runda till tusental: 4 000 + 5 000 = 9 000." },
    { q: "Ett familjepass kostar 2 896 kr och ett hotell 4 139 kr. Ungefär hur mycket kostar de tillsammans?", c: "7 000 kr", w: ["6 000 kr", "8 000 kr"], hint: "Runda till tusental: 3 000 + 4 000 = 7 000 kr." },
    { q: "Ungefär hur mycket är 6 912 − 2 105?", c: "5 000", w: ["4 000", "9 000"], hint: "Runda till tusental: 7 000 − 2 000 = 5 000." },
    { q: "Ungefär hur mycket är 4 089 + 1 876?", c: "6 000", w: ["5 000", "7 000"], hint: "Runda till tusental: 4 000 + 2 000 = 6 000." },
    { q: "Ungefär hur mycket är 9 870 − 3 120?", c: "7 000", w: ["6 000", "13 000"], hint: "Runda till tusental: 10 000 − 3 000 = 7 000." }
  ];

  var SAMBAND = [
    { q: "Vilken räkning hör ihop med 8 + 5 = 13?", c: "13 − 5 = 8", w: ["13 − 8 = 8", "5 − 8 = 13"], hint: "Addition och subtraktion hör ihop: 8 + 5 = 13 ger 13 − 5 = 8." },
    { q: "Vilken räkning hör ihop med 13 − 8 = 5?", c: "5 + 8 = 13", w: ["13 + 8 = 5", "5 + 13 = 8"], hint: "13 − 8 = 5 ger 5 + 8 = 13." },
    { q: "Ser du mönstret? 9 + 9 = 18 och 90 + 90 = 180. Vad är 900 + 900?", c: "1 800", w: ["180", "18 000"], hint: "Blir talen 10 gånger större blir svaret 10 gånger större: 900 + 900 = 1 800." },
    { q: "6 + 6 = 12. Vad är 60 + 60?", c: "120", w: ["1 200", "72"], hint: "6 + 6 = 12, så 60 + 60 = 120." },
    { q: "En cykel kostar 1 400 kr och en annan kostar 800 kr. Hur mycket skiljer det i pris?", c: "600 kr", w: ["2 200 kr", "700 kr"], hint: "Skillnaden räknar du med subtraktion: 1 400 − 800 = 600." },
    { q: "Vilket tal saknas? □ + 45 = 120", c: "75", w: ["165", "85"], hint: "Det som saknas får du med subtraktion: 120 − 45 = 75." }
  ];

  var FLERA = [
    { q: "Elma har 850 kr. Hon köper en tröja för 249 kr och ett par byxor för 380 kr. Hur mycket pengar har hon kvar?",
      a: "Svar: 221 kr\nSteg 1, vad hon betalar: 249 + 380 = 629\nSteg 2, pengar kvar: 850 − 629 = 221\nHon har 221 kr kvar." },
    { q: "Erik har 2 140 kr. Han köper en trumpet för 1 125 kr och en flöjt för 745 kr. Hur mycket pengar har han kvar?",
      a: "Svar: 270 kr\nSteg 1, trumpet och flöjt: 1 125 + 745 = 1 870\nSteg 2, pengar kvar: 2 140 − 1 870 = 270\nHan har 270 kr kvar." },
    { q: "Sara har 500 kr. Hon köper en bok för 135 kr och en tidning för 49 kr. Hur mycket pengar har hon kvar?",
      a: "Svar: 316 kr\nSteg 1, bok och tidning: 135 + 49 = 184\nSteg 2, pengar kvar: 500 − 184 = 316\nHon har 316 kr kvar." },
    { q: "Ali sparar 275 kr i januari och 340 kr i februari. Sedan köper han en hjälm för 450 kr. Hur mycket pengar har han kvar?",
      a: "Svar: 165 kr\nSteg 1, allt han sparat: 275 + 340 = 615\nSteg 2, pengar kvar: 615 − 450 = 165\nHan har 165 kr kvar." }
  ];

  var PROVA = [
    { q: "Ellen är 3 år äldre än Teo. Tillsammans är de 23 år. Hur gamla är Teo och Ellen?",
      a: "Svar: Teo är 10 år och Ellen är 13 år.\nGör en tabell och gissa Teos ålder. Ellen är alltid 3 år äldre.\nTeo 8, Ellen 11: 8 + 11 = 19, för litet.\nTeo 12, Ellen 15: 12 + 15 = 27, för mycket.\nTeo 10, Ellen 13: 10 + 13 = 23, rätt!" },
    { q: "Maja är 4 år äldre än Leo. Tillsammans är de 18 år. Hur gamla är Leo och Maja?",
      a: "Svar: Leo är 7 år och Maja är 11 år.\nGissa Leos ålder, Maja är alltid 4 år äldre.\nLeo 5, Maja 9: 5 + 9 = 14, för litet.\nLeo 8, Maja 12: 8 + 12 = 20, för mycket.\nLeo 7, Maja 11: 7 + 11 = 18, rätt!" },
    { q: "Marcus och Nora har tillsammans 30 kr. Marcus har 6 kr mer än Nora. Hur mycket har var och en?",
      a: "Svar: Nora har 12 kr och Marcus har 18 kr.\nGissa Noras pengar, Marcus har alltid 6 kr mer.\nNora 10, Marcus 16: 10 + 16 = 26, för litet.\nNora 14, Marcus 20: 14 + 20 = 34, för mycket.\nNora 12, Marcus 18: 12 + 18 = 30, rätt!" },
    { q: "En penna kostar 5 kr mer än ett suddgummi. Tillsammans kostar de 25 kr. Vad kostar var och en?",
      a: "Svar: Suddgummit kostar 10 kr och pennan kostar 15 kr.\nGissa suddgummits pris, pennan kostar alltid 5 kr mer.\nSuddgummi 8, penna 13: 8 + 13 = 21, för litet.\nSuddgummi 12, penna 17: 12 + 17 = 29, för mycket.\nSuddgummi 10, penna 15: 10 + 15 = 25, rätt!" }
  ];

  // Ordningen följer provlistan.
  var SECTIONS = [
    { n: 1, title: "Begrepp", kind: "choice", list: BEGREPP, key: "begrepp", summary: "BEGREPP: TERM, SUMMA, DIFFERENS" },
    { n: 2, title: "Uppställning", kind: "flip", list: UPPSTALLNING, key: "stall", page: "ma-boken s.46-49, 64-67", summary: "ADDITION OCH SUBTRAKTION MED UPPSTÄLLNING" },
    { n: 3, title: "Överslagsräkning", kind: "choice", list: OVERSLAG, key: "overslag", summary: "ÖVERSLAGSRÄKNING" },
    { n: 4, title: "Samband", kind: "choice", list: SAMBAND, key: "samband", summary: "SAMBANDET MELLAN ADDITION OCH SUBTRAKTION" },
    { n: 5, title: "Flera beräkningar", kind: "flip", list: FLERA, key: "flera", page: "ma-boken s.54-55, 70-71", summary: "UPPGIFTER MED FLERA BERÄKNINGAR" },
    { n: 6, title: "Pröva dig fram", kind: "flip", list: PROVA, key: "prova", page: "ma-boken s.57", summary: "PRÖVA DIG FRAM" }
  ];

  var cards = [];

  SECTIONS.forEach(function (sec) {
    // Genomgången kommer precis före uppställningarna.
    if (sec.n === 2) {
      LEKTIONER.forEach(function (l, i) {
        cards.push({
          type: "lesson",
          eyebrow: "2 · Genomgång · del " + (i + 1) + " av " + LEKTIONER.length,
          title: l.title,
          col: l.col,
          stages: l.stages,
          key: "lektion." + i
        });
      });
    }
    sec.list.forEach(function (it, i) {
      var eyebrow = sec.n + " · " + sec.title + " · " + (i + 1) + " av " + sec.list.length;
      if (sec.kind === "choice") {
        cards.push({
          type: "choice",
          eyebrow: eyebrow,
          prompt: nb(it.q),
          big: true,
          options: mk(it.c, it.w),
          correct: nb(it.c),
          key: sec.key + "." + i,
          correctMsg: nb("Rätt! " + it.hint),
          wrongMsg: nb("Nästan. " + it.hint)
        });
      } else {
        cards.push({
          type: "flip",
          eyebrow: eyebrow,
          question: nb(it.q),
          page: sec.page,
          answer: nb(it.a),
          column: it.col,
          correct: "kunde",
          key: sec.key + "." + i
        });
      }
    });
  });

  cards.push({
    type: "summary",
    eyebrow: "Klart! 🎉",
    title: "Bra jobbat!",
    lead: "Du har gått igenom hela provlistan för kapitel 2. Här är det du kan öva mer på.",
    buildSummary: function (state) {
      var lines = [];
      lines.push("MATTELÄXA 1 – KAPITEL 2, ADDITION OCH SUBTRAKTION");
      lines.push("Namn: " + (state.name || "–") + "    Datum: " + (state.date || "–"));
      SECTIONS.forEach(function (sec) {
        lines.push("");
        lines.push(sec.summary);
        sec.list.forEach(function (it, i) {
          var sel = state[sec.key] && state[sec.key][i];
          if (sec.kind === "choice") {
            lines.push("- " + it.q + " Rätt svar: " + it.c + (sel ? (sel === nb(it.c) ? "  ✓" : "  ✗ svarade " + sel) : "  (obesvarad)"));
          } else {
            var rating = sel === "kunde" ? "Kunde det ✓" : (sel === "ova" ? "Behöver öva mer" : "(obesvarad)");
            lines.push("- " + it.q + "  " + rating);
          }
        });
      });
      return lines.join("\n");
    }
  });

  SwipeHomework.init({
    mount: "#app",
    title: "Matteläxa 1",
    subtitle: "Matte · Kapitel 2",
    storageKey: "franco-matte-laxa-1-v1",
    backHref: "../index.html",
    cards: cards
  });
})();
</script>
</body>
</html>
